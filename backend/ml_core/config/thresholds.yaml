# AMSDDS pipeline config — SINGLE source of truth for the handover ML engine.
# /model-info serves this. All numbers measured on lesion-grouped held-out
# splits. Do not hand-edit without re-measuring; see the handover README
# "changing weights" section.
#
# Copied from handover/amsdds_backend/amsdds/backend/config/thresholds.yaml.
# The ONLY change is `ood.enabled: false` (see below).

weights_dir: ../weights            # the app sets AMSDDS_WEIGHTS to an absolute
                                   # path (backend/config.py); this relative
                                   # value is only a fallback.

classes: [akiec, bcc, bkl, df, mel, nv, vasc]
malignant_classes: [mel, bcc, akiec]
class_names:
  akiec: Actinic keratosis / intraepithelial carcinoma
  bcc:   Basal cell carcinoma
  bkl:   Benign keratosis
  df:    Dermatofibroma
  mel:   Melanoma
  nv:    Melanocytic nevus
  vasc:  Vascular lesion

layer1:                            # multimodal MobileNetV3 (image + age/sex/localization)
  file: layer1_multimodal_mobilenetv3.pt
  img_size: 299
  resize_short: 324
  # temperature/meta encoders are read from inside the checkpoint (T=0.959)

layer2:
  backbone: panderm                # panderm (current) | rtdetr (fallback/reference)

  panderm:                         # PanDerm_Base (BEiT ViT-B/16) fully fine-tuned
                                    # end-to-end on HAM10000. Single self-contained
                                    # checkpoint (backbone + head + temperature) from
                                    # amsdds_v2/outputs/layer2_panderm_ft_v1.pt — see
                                    # amsdds_v2/notebooks/panderm.ipynb. No selectable
                                    # heads: the candidate probe/pad heads need two
                                    # different backbones and are not wired in (see
                                    # backend/ml_core/models.py::PanDermLayer2 docstring).
    file: layer2_panderm_ft_v1.pt
    img_size: 224
    resize_short: 255

  rtdetr:                          # frozen RT-DETR encoder + GOA-tuned MLP head
    file: layer2_rtdetr.pt         # encoder (backbone + hybrid encoder), img 512
    img_size: 512
    resize_short: 588
    hf_name: PekingU/rtdetr_r50vd
    heads:                         # both loaded; select per request or by default
      ham:    layer2_rtdetr_goa_head.pt          # dermoscopy-only head (T=0.735)
      hampad: layer2_rtdetr_goa_head_hampad.pt   # phone-capable head   (T=0.803)
    default_head: hampad

  ensemble_with_layer1: false

decision_engine:                   # gate derived for the 299 multimodal L1 (thresholds4299)
  conf_threshold: 0.5
  entropy_threshold: 0.3
  uncertain_floor: 0.5
  risk_threshold: 0.26             # sum P(mel,bcc,akiec) >= this -> risk flag,
                                   # tuned on PAD val (sens 0.964), test sens 0.966

ood:
  # -------------------------------------------------------------------------
  # TEMPORARILY DISABLED for this integration phase.
  #
  # ood_scores_mobilenet.npz was generated from the RETIRED image-only 224px
  # Layer 1, not the current multimodal 299px model. Against the current
  # 1280-D feature space it rejects genuine HAM10000 images as OOD
  # (Mahalanobis ~12000 vs threshold ~3601), so every real image would be
  # returned as "unknown".
  #
  # Do NOT re-tune the threshold or the Mahalanobis maths to "fix" this.
  # Flip `enabled` back to true once the ML team supplies a corrected artifact
  # fit on layer1_multimodal_mobilenetv3.pt. See backend/ml_core/README.md.
  # -------------------------------------------------------------------------
  enabled: true
  file: ood_scores_mobilenet.npz   # Mahalanobis on L1 1280-d image features (299 model)
  threshold: null                  # null -> unk_thr inside the npz (2583.9)

preprocessing:
  color_constancy: true            # shades-of-gray p6 — MUST match training
  color_constancy_power: 6

measured:                          # for /model-info and the deck; not load-bearing
  layer1: {test_acc: 0.8446, test_macro_f1: 0.7077, temperature: 0.959,
           escalation_rate: 0.2831, fastpath_accuracy: 0.9371,
           dangerous_misses: 75, caught_by_gate: 54, leaked: 21}
  layer2_hampad: {ham_test_acc: 0.857, ham_test_f1: 0.736,        # RT-DETR (fallback), see layer2.rtdetr
                  pad_test_acc: 0.638, pad_test_f1_present_classes: 0.55}
  layer2_panderm: {ham_test_acc: 0.8508, ham_test_f1: 0.7879, ham_test_ece: 0.0601,   # current
                   ham_test_mal_sensitivity: 0.8773, ham_test_mal_specificity: 0.8660,
                   temperature: 0.827, source: "amsdds_v2/outputs/layer2_panderm_ft_v1.pt"}
  risk_flag: {pad_test_malignant_sensitivity: 0.966, pad_test_benign_specificity: 0.484,
              tuned_on: pad_val}
  ood: {far_auroc: 0.907, unk_thr: 2583.9}
  pending: "adapted Layer 1 (HAM+PAD) -> then re-fit OOD, re-sweep gate, re-score GOA"
